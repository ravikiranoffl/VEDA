name: VEDA Pan-India Generator

on:
  schedule:
    # Runs every 2 hours at minute 0 (00:30, 02:30, 04:30... IST)
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-veda-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp trafilatura huggingface_hub

      - name: Execute VEDA Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} 
        run: python veda.py

      - name: Generate Commit Timestamp (IST)
        id: time
        run: echo "TS=$(TZ='Asia/Kolkata' date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Commit Hourly Data Update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ env.TS }}
          commit_user_name: "ravikiranoffl"
          commit_user_email: "171322216+ravikiranoffl@users.noreply.github.com"
          commit_author: "ravikiranoffl <171322216+ravikiranoffl@users.noreply.github.com>"
          file_pattern: "*/*.json status.json"
