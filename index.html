<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDA | Premium Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Fallback variables, dynamically overwritten by JS */
            --bg-base: #0b0c10;
            --bg-grad1: #1f2833;
            --bg-grad2: #0b0c10;
            --accent: #66fcf1;
            --accent-glow: rgba(102, 252, 241, 0.2);
            --surface: rgba(255, 255, 255, 0.02);
            --surface-hover: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f0;
            --text-muted: #8892b0;
            color-scheme: dark;
        }

        /* --- CORE STYLES --- */
        body {
            margin: 0;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 0%, var(--bg-grad1) 0%, transparent 45%),
                radial-gradient(circle at 85% 100%, var(--bg-grad2) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 1s ease, background-image 1s ease;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 4vh 2vw;
            box-sizing: border-box;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        h1 {
            font-weight: 300;
            letter-spacing: clamp(4px, 1vw, 12px);
            text-transform: uppercase;
            font-size: clamp(2rem, 4vw, 3.5rem);
            margin: 0;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: background 1s ease;
        }

        /* --- SEARCH BAR --- */
        .search-container {
            position: relative;
            width: clamp(280px, 60%, 800px);
            margin: 0 auto 2.5rem auto;
            transition: transform 0.4s ease;
        }

        .search-container:focus-within {
            transform: scale(1.02);
        }

        #searchInput {
            width: 100%;
            padding: 1.2rem 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-main);
            font-size: 1.1rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        #searchInput::placeholder { color: var(--text-muted); transition: color 0.3s; }

        #searchInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.02);
            background: var(--surface-hover);
        }

        /* --- DYNAMIC FILTERS & CUSTOM DROPDOWNS --- */
        .filters-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 100;
        }

        .date-picker {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px 24px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.95rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .date-picker:hover, .date-picker:focus {
            border-color: var(--accent);
            background: var(--surface-hover);
            box-shadow: 0 0 15px var(--accent-glow);
            outline: none;
        }

        /* CUSTOM DROPDOWN UI */
        .custom-dropdown {
            position: relative;
            min-width: 200px;
            font-size: 0.95rem;
        }

        .dropdown-selected {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px 24px;
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .dropdown-selected:hover {
            border-color: var(--accent);
            background: var(--surface-hover);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .dropdown-selected::after {
            content: '▼';
            font-size: 0.7em;
            color: var(--accent);
            transition: transform 0.3s;
        }

        .custom-dropdown.active .dropdown-selected::after {
            transform: rotate(-180deg);
        }

        .dropdown-options {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 100%;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-height: 0;
            overflow-y: auto;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 1000;
        }

        .custom-dropdown.active .dropdown-options {
            max-height: 350px;
            opacity: 1;
            pointer-events: auto;
        }

        .dropdown-option {
            padding: 14px 24px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            transform: translateX(-10px);
            opacity: 0;
        }

        .custom-dropdown.active .dropdown-option {
            transform: translateX(0);
            opacity: 1;
        }

        .dropdown-option:hover {
            color: var(--accent);
            background: var(--surface-hover);
            padding-left: 30px; 
        }

        .dropdown-options::-webkit-scrollbar { width: 6px; }
        .dropdown-options::-webkit-scrollbar-thumb { background: var(--accent-glow); border-radius: 10px; }

        /* --- DYNAMIC NEWS GRID --- */
        #news-grid {
            display: grid;
            gap: clamp(1.5rem, 2vw, 2.5rem);
            grid-template-columns: 1fr; 
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: clamp(1.5rem, 3vw, 2.5rem);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(30px) scale(0.98);
        }

        .card.pinned-latest {
            border-color: var(--accent);
            box-shadow: inset 0 0 20px var(--accent-glow);
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            border-color: var(--accent);
            background: var(--surface-hover);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), 0 0 20px var(--accent-glow);
            transform: translateY(-8px);
        }

        .card-tag {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .card-title {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            line-height: 1.5;
            margin-bottom: 2rem;
            font-weight: 400;
            color: var(--text-main);
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .read-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
            cursor: pointer;
            font-family: inherit;
        }

        .read-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--accent);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .read-btn:hover {
            color: var(--bg-base);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .read-btn:hover::before {
            left: 0;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* --- DEEP ARCHIVE MODAL STYLES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--bg-base); border: 1px solid var(--accent);
            width: 90%; max-width: 800px; max-height: 85vh; border-radius: 20px;
            padding: 30px; overflow-y: auto; position: relative;
            box-shadow: 0 0 40px var(--accent-glow);
            transform: translateY(20px); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .close-modal {
            position: absolute; top: 20px; right: 20px;
            background: none; border: none; color: var(--text-muted);
            font-size: 24px; cursor: pointer; transition: color 0.2s;
        }
        .close-modal:hover { color: var(--accent); }

        .modal-text {
            color: var(--text-main); line-height: 1.8; font-size: 1.1rem;
            white-space: pre-wrap; /* Preserves paragraphs */
        }

        /* --- RESPONSIVE SHAPE-SHIFTING --- */
        @media (min-width: 768px) { #news-grid { grid-template-columns: repeat(2, 1fr); } .filters-wrapper { gap: 25px; } }
        @media (min-width: 1024px) { #news-grid { grid-template-columns: repeat(3, 1fr); } .custom-dropdown.channel { min-width: 260px; } }
        @media (min-width: 1600px) { #news-grid { grid-template-columns: repeat(4, 1fr); } .container { max-width: 1800px; } }
        @media (max-width: 500px) {
            .filters-wrapper { flex-direction: column; width: 100%; }
            .date-picker, .custom-dropdown { width: 100%; box-sizing: border-box; }
            #searchInput { border-radius: 16px; } 
            .card { border-radius: 16px; }
            .modal-content { width: 95%; padding: 20px; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VEDA Matrix</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Initializing neural link...">
    </div>

    <div class="filters-wrapper">
        <input type="date" id="datePicker" class="date-picker" min="2026-04-27">

        <div class="custom-dropdown channel" id="channelDropdown">
            <div class="dropdown-selected" id="channelSelected">Global Matrix (All)</div>
            <div class="dropdown-options" id="channelOptions">
                <div class="dropdown-option" data-value="all">Global Matrix (All)</div>
            </div>
        </div>

        <div class="custom-dropdown" id="limitDropdown">
            <div class="dropdown-selected" id="limitSelected">Show 100 Intel</div>
            <div class="dropdown-options" id="limitOptions">
                <div class="dropdown-option" data-value="100">Show 100 Intel</div>
                <div class="dropdown-option" data-value="250">Show 250 Intel</div>
            </div>
        </div>

        <div class="custom-dropdown" id="themeDropdown">
            <div class="dropdown-selected" id="themeSelected">Select Theme</div>
            <div class="dropdown-options" id="themeOptions"></div>
        </div>
    </div>

    <div id="news-grid"></div>
</div>

<div class="modal-overlay" id="deepModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">×</button>
        <h2 id="modalTitle" style="color: var(--accent); margin-top:0; padding-right: 30px;">Accessing Deep Archive...</h2>
        <div id="modalBody" class="modal-text">
            <p style="opacity:0.5; text-align:center;">Establishing uplink to HEDA...</p>
        </div>
    </div>
</div>

<script>
    // --- 1. PREMIUM AUTHENTIC THEME ENGINE ---
    const themes = {
        "Obsidian Pearl": { base: "#07080a", grad1: "#141821", grad2: "#07080a", accent: "#66fcf1", glow: "rgba(102, 252, 241, 0.25)" },
        "Sapphire Depth": { base: "#020914", grad1: "#0a192f", grad2: "#010409", accent: "#64ffda", glow: "rgba(100, 255, 218, 0.25)" },
        "Midnight Ember": { base: "#0d0202", grad1: "#260606", grad2: "#080101", accent: "#ff4d4d", glow: "rgba(255, 77, 77, 0.25)" },
        "Royal Amethyst": { base: "#0a0512", grad1: "#1f0f33", grad2: "#05020a", accent: "#c299ff", glow: "rgba(194, 153, 255, 0.25)" },
        "Gilded Carbon": { base: "#0a0a0a", grad1: "#1a1a1a", grad2: "#050505", accent: "#e6c200", glow: "rgba(230, 194, 0, 0.25)" },
        "Emerald Frost": { base: "#010a08", grad1: "#02241d", grad2: "#000504", accent: "#00fa9a", glow: "rgba(0, 250, 154, 0.25)" },
        "Neon Cyberpunk": { base: "#05000a", grad1: "#1a0029", grad2: "#05000a", accent: "#ff00e6", glow: "rgba(255, 0, 230, 0.25)" },
        "Abyssal Trench": { base: "#000b18", grad1: "#001b3a", grad2: "#000b18", accent: "#00bfff", glow: "rgba(0, 191, 255, 0.25)" },
        "Solar Flare": { base: "#0a0300", grad1: "#240a00", grad2: "#0a0300", accent: "#ff8c00", glow: "rgba(255, 140, 0, 0.25)" },
        "Quantum Silver": { base: "#0f1115", grad1: "#1c2026", grad2: "#0f1115", accent: "#e2e8f0", glow: "rgba(226, 232, 240, 0.25)" },
        "Toxic Matrix": { base: "#000a00", grad1: "#001a00", grad2: "#000a00", accent: "#39ff14", glow: "rgba(57, 255, 20, 0.25)" },
        "Aurora Borealis": { base: "#010a14", grad1: "#031c26", grad2: "#010a14", accent: "#00ffcc", glow: "rgba(0, 255, 204, 0.25)" }
    };

    const themeNames = Object.keys(themes);

    function applyTheme(themeName) {
        const theme = themes[themeName];
        if(!theme) return;
        document.documentElement.style.setProperty('--bg-base', theme.base);
        document.documentElement.style.setProperty('--bg-grad1', theme.grad1);
        document.documentElement.style.setProperty('--bg-grad2', theme.grad2);
        document.documentElement.style.setProperty('--accent', theme.accent);
        document.documentElement.style.setProperty('--accent-glow', theme.glow);
        document.getElementById('themeSelected').innerText = themeName;
    }

    applyTheme(themeNames[Math.floor(Math.random() * themeNames.length)]);

    // --- 2. CUSTOM DROPDOWN LOGIC ---
    function setupDropdown(dropdownId, selectedId, optionsId, onChangeCallback) {
        const dropdown = document.getElementById(dropdownId);
        const selected = document.getElementById(selectedId);
        const optionsContainer = document.getElementById(optionsId);

        selected.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.custom-dropdown').forEach(d => {
                if(d !== dropdown) d.classList.remove('active');
            });
            dropdown.classList.toggle('active');
        });

        optionsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('dropdown-option')) {
                const value = e.target.getAttribute('data-value');
                selected.innerText = e.target.innerText;
                dropdown.classList.remove('active');
                if (onChangeCallback) onChangeCallback(value);
            }
        });
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.custom-dropdown').forEach(d => d.classList.remove('active'));
    });

    const themeOptionsContainer = document.getElementById('themeOptions');
    themeNames.forEach(themeName => {
        const opt = document.createElement('div');
        opt.className = 'dropdown-option';
        opt.setAttribute('data-value', themeName);
        opt.innerText = themeName;
        themeOptionsContainer.appendChild(opt);
    });

    setupDropdown('themeDropdown', 'themeSelected', 'themeOptions', (val) => applyTheme(val));

    let currentChannelFilter = 'all';
    setupDropdown('channelDropdown', 'channelSelected', 'channelOptions', (val) => {
        currentChannelFilter = val;
        filterAndRender();
    });

    let currentLimitFilter = 100;
    setupDropdown('limitDropdown', 'limitSelected', 'limitOptions', (val) => {
        currentLimitFilter = parseInt(val, 10);
        filterAndRender();
    });

    // --- 3. DYNAMIC TYPING ENGINE ---
    const searchInput = document.getElementById('searchInput');
    const suggestions = ['Analyze "The Hindu"...', 'Extract "Global Economy"...', 'Scan for "Markets"...', 'Intercept "Telugu News"...', 'Decode "Technology"...'];
    suggestions.sort(() => Math.random() - 0.5);

    let suggestionIndex = 0, charIndex = 0, isDeleting = false, typingTimer;

    function typePlaceholder() {
        if (document.activeElement === searchInput) { searchInput.placeholder = "Query global matrix..."; clearTimeout(typingTimer); return; }
        const currentWord = suggestions[suggestionIndex];
        isDeleting ? charIndex-- : charIndex++;
        searchInput.placeholder = currentWord.substring(0, charIndex) + "|";
        let typingSpeed = isDeleting ? 30 : 80;

        if (!isDeleting && charIndex === currentWord.length) { typingSpeed = 2500; isDeleting = true; } 
        else if (isDeleting && charIndex === 0) { isDeleting = false; suggestionIndex = (suggestionIndex + 1) % suggestions.length; typingSpeed = 500; }
        typingTimer = setTimeout(typePlaceholder, typingSpeed);
    }
    typePlaceholder();

    searchInput.addEventListener('focus', () => { clearTimeout(typingTimer); searchInput.placeholder = "Query global matrix..."; });
    searchInput.addEventListener('blur', () => { if (searchInput.value.trim() === '') typePlaceholder(); });
    searchInput.addEventListener('input', () => filterAndRender());

    // --- 4. DATA ENGINE & STRICT CHRONOLOGICAL SORTING ---
    let rawData = [];
    const grid = document.getElementById('news-grid');
    const datePicker = document.getElementById('datePicker');

    // INITIALIZE DATE PICKER (Dynamic Today)
    const today = new Date();
    const istOffset = 5.5 * 60 * 60 * 1000;
    const istTime = new Date(today.getTime() + istOffset);
    const todayStr = istTime.toISOString().split('T')[0];
    
    datePicker.value = todayStr;
    datePicker.max = todayStr; // Block Future
    datePicker.addEventListener('change', (e) => init(e.target.value));

    async function init(date) {
        grid.innerHTML = '<p style="text-align:center; opacity:0.5; width:100%;">Establishing Secure Connection to VEDA Archive...</p>';
        const year = date.split('-')[0];

        try {
            const res = await fetch(`${year}/${date}.json`);
            if (!res.ok) throw new Error("Intelligence not found for this temporal coordinate.");
            const data = await res.json();

            rawData = [];
            Object.keys(data.feeds).forEach(source => {
                data.feeds[source].forEach(item => {
                    rawData.push({ ...item, source });
                });
            });

            populateChannels(Object.keys(data.feeds));
            filterAndRender();
        } catch (e) {
            grid.innerHTML = `<p style="text-align:center; color:var(--accent); width:100%;">${e.message}</p>`;
        }
    }

    function populateChannels(sources) {
        const container = document.getElementById('channelOptions');
        container.innerHTML = '<div class="dropdown-option" data-value="all">Global Matrix (All)</div>';
        sources.sort().forEach(s => {
            const opt = document.createElement('div');
            opt.className = 'dropdown-option';
            opt.setAttribute('data-value', s);
            opt.innerText = s.replace(/_/g, ' ');
            container.appendChild(opt);
        });
        document.getElementById('channelSelected').innerText = 'Global Matrix (All)';
        currentChannelFilter = 'all';
    }

    function filterAndRender() {
        const query = searchInput.value.toLowerCase();
        let filtered = rawData.filter(item => {
            const matchChannel = currentChannelFilter === 'all' || item.source === currentChannelFilter;
            const matchQuery = item.title.toLowerCase().includes(query) || item.source.toLowerCase().includes(query);
            return matchChannel && matchQuery;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="text-align:center; opacity:0.5; width:100%;">No intelligence matches your parameters.</p>';
            return;
        }

        // Strict Chronological Sort
        filtered.sort((a, b) => {
            const dateA = new Date(a.published_at).getTime() || 0;
            const dateB = new Date(b.published_at).getTime() || 0;
            return dateB - dateA;
        });

        // Slice to User Limit
        filtered = filtered.slice(0, currentLimitFilter);

        // RENDER DOM
        grid.innerHTML = '';
        filtered.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `card ${index === 0 ? 'pinned-latest' : ''}`;
            
            const formatSource = item.source.replace(/_/g, ' ');
            const dateStr = item.published_at !== "N/A" ? new Date(item.published_at).toLocaleString() : 'Recent';

            // Clean title to avoid breaking HTML attributes
            const safeTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            card.innerHTML = `
                <div class="card-tag">${index === 0 ? '🔥 BREAKING REAL-TIME' : formatSource}</div>
                <h3 class="card-title">${item.title}</h3>
                <div class="card-footer">
                    <span class="timestamp">${dateStr}</span>
                    <button onclick="openDeepArchive('${item.id}', '${safeTitle}', '${item.url}', '${datePicker.value}')" class="read-btn">Deep Scan &rarr;</button>
                </div>
            `;
            grid.appendChild(card);
            
            // Pop-in animation
            setTimeout(() => card.classList.add('visible'), 30 * index);
        });
    }

    // --- 5. HEDA UPLINK & MODAL LOGIC ---
    let cachedDeepArchive = null;
    let cachedArchiveDate = null;

    async function openDeepArchive(articleId, title, originalUrl, dateStr) {
        const modal = document.getElementById('deepModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.innerText = title;
        modalBody.innerHTML = '<p style="opacity:0.5; text-align:center;">Establishing uplink to HEDA Vault...</p>';
        modal.classList.add('active');

        // Fetch the 30MB file from Hugging Face only once per session
        if (cachedArchiveDate !== dateStr || !cachedDeepArchive) {
            try {
                // Connects directly to ravikiranoffl/HEDA
                const hfUrl = `https://huggingface.co/datasets/ravikiranoffl/HEDA/resolve/main/data/${dateStr}.json`;
                const res = await fetch(hfUrl);
                if (!res.ok) throw new Error("Archive missing");
                cachedDeepArchive = await res.json();
                cachedArchiveDate = dateStr;
            } catch (e) {
                modalBody.innerHTML = `
                    <p style="color:#ff4d4d; text-align:center;">Deep Archive unavailable for this coordinate.</p>
                    <div style="text-align:center; margin-top:20px;">
                        <a href="${originalUrl}" target="_blank" class="read-btn" style="display:inline-block;">Open Source Node &rarr;</a>
                    </div>
                `;
                return;
            }
        }

        // Display the specific article
        const deepText = cachedDeepArchive[articleId];
        if (deepText) {
            modalBody.innerText = deepText;
            modalBody.innerHTML += `
                <br><br>
                <div style="text-align:center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
                    <a href="${originalUrl}" target="_blank" class="read-btn" style="display:inline-block;">View Original Source</a>
                </div>
            `;
        } else {
            modalBody.innerHTML = `
                <p style="color:#ff4d4d; text-align:center;">Extraction failed during sweep. Node may be encrypted.</p>
                <div style="text-align:center; margin-top:20px;">
                    <a href="${originalUrl}" target="_blank" class="read-btn" style="display:inline-block;">Open Source Node &rarr;</a>
                </div>
            `;
        }
    }

    function closeModal() {
        document.getElementById('deepModal').classList.remove('active');
    }

    // Close modal when clicking the dark overlay outside the box
    document.getElementById('deepModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // Trigger Initial Load
    init(datePicker.value);

</script>
</body>
</html>
