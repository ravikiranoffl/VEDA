<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEDA | Premium Intelligence Matrix</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg-base:#030407;
--bg-grad1:#0a111a;
--bg-grad2:#020204;
--accent:#00f3ff;
--accent-glow:rgba(0,243,255,0.35);
--surface:rgba(15,20,30,0.4);
--border:rgba(255,255,255,0.05);
--text-main:#f8f9fa;
--text-muted:#8b9bb4;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:'Plus Jakarta Sans',sans-serif;
background:radial-gradient(circle at 20% -10%,var(--bg-grad1),transparent),radial-gradient(circle at 80% 110%,var(--bg-grad2),transparent),var(--bg-base);
color:var(--text-main);
overflow-x:hidden;
min-height:100vh;
transition:all .6s ease;
}
.canvas-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}
.top-nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
padding:20px;
background:rgba(0,0,0,.5);
backdrop-filter:blur(10px);
z-index:1000;
}
.brand-logo{
font-size:1.6rem;
letter-spacing:6px;
background:linear-gradient(135deg,#fff,var(--accent));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.hamburger span{
display:block;
width:30px;
height:2px;
background:var(--accent);
margin:6px 0;
transition:.4s;
}
.sidebar{
position:fixed;
right:-320px;
top:0;
width:320px;
height:100%;
background:rgba(0,0,0,.9);
backdrop-filter:blur(20px);
padding:100px 20px;
transition:.5s;
z-index:999;
}
.sidebar.active{right:0}
.menu-item{
display:block;
padding:15px;
text-decoration:none;
color:var(--text-main);
border-bottom:1px solid var(--border);
transition:.3s;
}
.menu-item:hover{color:var(--accent)}
.container{padding-top:100px;max-width:1400px;margin:auto}
h1{text-align:center;font-size:3rem}
#news-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}
.card{
background:var(--surface);
border:1px solid var(--border);
padding:20px;
border-radius:20px;
backdrop-filter:blur(15px);
transition:.4s;
position:relative;
overflow:hidden;
}
.card:hover{
transform:translateY(-8px) scale(1.02);
box-shadow:0 0 30px var(--accent-glow);
}
.card::after{
content:'';
position:absolute;
width:200%;
height:200%;
background:radial-gradient(circle,var(--accent-glow),transparent);
opacity:0;
transition:.5s;
}
.card:hover::after{opacity:.6}
.read-btn{
display:inline-block;
margin-top:15px;
padding:10px 20px;
border:1px solid var(--accent);
color:var(--accent);
text-decoration:none;
border-radius:8px;
transition:.3s;
}
.read-btn:hover{
background:var(--accent);
color:#000;
}
.section-title{text-align:center;font-size:2rem;margin:40px 0}
.theme-btn{
padding:12px 25px;
border-radius:10px;
cursor:pointer;
transition:.4s;
}
.theme-btn:hover{transform:scale(1.05)}
.particles{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
}
.particle{
position:absolute;
width:6px;
height:6px;
background:var(--accent);
border-radius:50%;
opacity:.6;
animation:float 10s linear infinite;
}
@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-100vh)}
}
</style>
</head>

<body>

<canvas class="canvas-bg" id="bgCanvas"></canvas>

<nav class="top-nav">
<h1 class="brand-logo">VEDA</h1>
<div class="hamburger" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>
</nav>

<div class="sidebar" id="sidebarMenu">
<a href="#" class="menu-item">Neural Grid</a>
<a href="#" class="menu-item">Matrix Calibration</a>
</div>

<div class="container">

<h1>Neural Matrix</h1>

<div id="news-grid"></div>

<h2 class="section-title">Matrix Calibration</h2>
<div id="themeButtonsContainer" style="display:flex;flex-wrap:wrap;gap:15px;justify-content:center"></div>

</div>

<script>
function toggleMenu(){
document.getElementById('sidebarMenu').classList.toggle('active')
}

const themes={
"Deep Amethyst":{base:"#040108",grad1:"#1b0a3a",grad2:"#080310",accent:"#aa44ff",glow:"rgba(170,68,255,0.4)",text:"#f0e6ff"},
"Cyber Cyan":{base:"#020508",grad1:"#06111a",grad2:"#010204",accent:"#00f3ff",glow:"rgba(0,243,255,0.4)",text:"#e6fdff"},
"Acid Rain":{base:"#030602",grad1:"#0a1708",grad2:"#010301",accent:"#39ff14",glow:"rgba(57,255,20,0.4)",text:"#efffe6"},
"Reactor Yellow":{base:"#080701",grad1:"#1a1602",grad2:"#040300",accent:"#ffea00",glow:"rgba(255,234,0,0.4)",text:"#fffce6"},
"Blood Moon":{base:"#080202",grad1:"#1a0404",grad2:"#040101",accent:"#ff2a2a",glow:"rgba(255,42,42,0.4)",text:"#ffe6e6"},
"Neon Void":{base:"#000",grad1:"#050505",grad2:"#000",accent:"#fff",glow:"rgba(255,255,255,0.3)",text:"#fff"},
"Electric Indigo":{base:"#02030a",grad1:"#0a0f2a",grad2:"#010118",accent:"#5a6bff",glow:"rgba(90,107,255,0.4)",text:"#e8ebff"},
"Plasma Pink":{base:"#07010a",grad1:"#1f0030",grad2:"#0a0015",accent:"#ff00c8",glow:"rgba(255,0,200,0.4)",text:"#ffe6fb"},
"Solar Flare":{base:"#0a0200",grad1:"#2a0f00",grad2:"#140400",accent:"#ff6a00",glow:"rgba(255,106,0,0.4)",text:"#fff1e6"},
"Frozen Aurora":{base:"#010a0f",grad1:"#003344",grad2:"#000d12",accent:"#00ffe1",glow:"rgba(0,255,225,0.4)",text:"#e6fffb"}
}

const themeNames=Object.keys(themes)

function applyTheme(name){
const t=themes[name]
document.documentElement.style.setProperty('--bg-base',t.base)
document.documentElement.style.setProperty('--bg-grad1',t.grad1)
document.documentElement.style.setProperty('--bg-grad2',t.grad2)
document.documentElement.style.setProperty('--accent',t.accent)
document.documentElement.style.setProperty('--accent-glow',t.glow)
localStorage.setItem("veda-theme",name)
}

(function(){
const saved=localStorage.getItem("veda-theme")
if(saved){applyTheme(saved)}
else{
const r=themeNames[Math.floor(Math.random()*themeNames.length)]
applyTheme(r)
}
})()

const container=document.getElementById('themeButtonsContainer')
themeNames.forEach(n=>{
const b=document.createElement('button')
b.className='theme-btn'
b.innerText=n
b.onclick=()=>applyTheme(n)
container.appendChild(b)
})

function createParticles(){
const count=50
for(let i=0;i<count;i++){
const p=document.createElement('div')
p.className='particle'
p.style.left=Math.random()*100+'%'
p.style.animationDuration=(Math.random()*10+5)+'s'
document.body.appendChild(p)
}
}
createParticles()

const canvas=document.getElementById("bgCanvas")
const ctx=canvas.getContext("2d")
canvas.width=window.innerWidth
canvas.height=window.innerHeight

let stars=[]
for(let i=0;i<120;i++){
stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5})
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height)
ctx.fillStyle="white"
stars.forEach(s=>{
ctx.beginPath()
ctx.arc(s.x,s.y,s.r,0,Math.PI*2)
ctx.fill()
s.y+=0.2
if(s.y>canvas.height)s.y=0
})
requestAnimationFrame(animate)
}
animate()
</script>

</body>
</html>
