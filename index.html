<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDA | Premium Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.12);
            --accent: #00ffaa;
            --accent-glow: rgba(0, 255, 170, 0.3);
            --text: #e0e0e0;
        }

        body {
            margin: 0;
            background: #050608;
            background-image: 
                radial-gradient(circle at 0% 0%, #161b2e 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, #0a1120 0%, transparent 50%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-size: 2.8rem;
            margin: 0;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Dynamic Control Panel --- */
        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        #searchInput {
            width: 100%;
            padding: 15px 25px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(255,255,255,0.05);
            width: 105%;
            margin-left: -2.5%;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .custom-select {
            position: relative;
            min-width: 200px;
        }

        select, input[type="date"] {
            appearance: none;
            background: var(--glass);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        select:hover, input:hover {
            border-color: var(--accent);
            background: var(--glass-hover);
        }

        /* --- News Feed Grid --- */
        #news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(20px);
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-tag {
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.25rem;
            line-height: 1.4;
            margin-bottom: 25px;
            font-weight: 400;
            color: #fff;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .read-btn {
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .read-btn:hover {
            background: var(--accent);
            color: #000;
        }

        .timestamp {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VEDA PLATFORM</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search global intelligence...">
    </div>

    <div class="filters">
        <input type="date" id="datePicker">
        <select id="channelFilter">
            <option value="all">Global Matrix</option>
        </select>
    </div>

    <div id="news-grid"></div>
</div>

<script>
    let rawData = [];
    const grid = document.getElementById('news-grid');
    const searchInput = document.getElementById('searchInput');
    const channelFilter = document.getElementById('channelFilter');
    const datePicker = document.getElementById('datePicker');

    // Auto-set today
    datePicker.value = new Date().toISOString().split('T')[0];

    async function init(date) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; opacity:0.5;">Accessing Archive...</p>';
        const year = date.split('-')[0];
        
        try {
            const res = await fetch(`${year}/${date}.json`);
            if (!res.ok) throw new Error("No data found for this period.");
            const data = await res.json();
            
            // Flatten data for easier searching
            rawData = [];
            Object.keys(data.feeds).forEach(source => {
                data.feeds[source].forEach(item => {
                    rawData.push({ ...item, source });
                });
            });

            populateChannels(Object.keys(data.feeds));
            filterAndRender();
        } catch (e) {
            grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--accent);">${e.message}</p>`;
        }
    }

    function populateChannels(sources) {
        channelFilter.innerHTML = '<option value="all">Global Matrix (All)</option>';
        sources.sort().forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s.replace(/_/g, ' ');
            channelFilter.appendChild(opt);
        });
    }

    function filterAndRender() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedSource = channelFilter.value;

        const filtered = rawData.filter(item => {
            const matchesSearch = item.title.toLowerCase().includes(searchTerm);
            const matchesSource = selectedSource === 'all' || item.source === selectedSource;
            return matchesSearch && matchesSource;
        });

        render(filtered);
    }

    function render(items) {
        grid.innerHTML = '';
        if (items.length === 0) {
            grid.innerHTML = '<p style="grid-column:1/-1; text-align:center;">No results match your query.</p>';
            return;
        }

        items.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-tag">${item.source.replace(/_/g, ' ')}</div>
                <div class="card-title">${item.title}</div>
                <div class="card-footer">
                    <span class="timestamp">${item.published_at.split(' ').slice(0,4).join(' ')}</span>
                    <a href="${item.url}" target="_blank" class="read-btn">Full Report →</a>
                </div>
            `;
            grid.appendChild(card);
            
            // Staggered animation
            setTimeout(() => card.classList.add('visible'), i * 50);
        });
    }

    // Dynamic Listeners
    searchInput.addEventListener('input', filterAndRender);
    channelFilter.addEventListener('change', filterAndRender);
    datePicker.addEventListener('change', (e) => init(e.target.value));

    // Initial Load
    init(datePicker.value);
</script>

</body>
</html>
