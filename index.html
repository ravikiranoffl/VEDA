<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gemini Chronicle Agent | Archive</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600;700&display=swap');

    /* CSS Variables for Dark/Light Mode Support */
    :root[data-theme="light"] {
      --bg-color: #f1f5f9;
      --text-color: #334155;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --accent-color: #0369a1;
      --accent-hover: #0284c7;
      --today-bg: #f0fdf4;
      --today-border: #10b981;
      --today-text: #064e3b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    :root[data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #e2e8f0;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-color: #38bdf8;
      --accent-hover: #7dd3fc;
      --today-bg: #064e3b;
      --today-border: #34d399;
      --today-text: #a7f3d0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
    }

    /* Base Styling */
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header Styling */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin: 0 0 10px 0;
      letter-spacing: 1px;
    }

    .header p {
      font-size: 15px;
      opacity: 0.8;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* Controls Styling */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 15px 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .controls-group {
      display: flex;
      gap: 15px;
    }

    .premium-dropdown {
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .premium-dropdown:focus {
      border-color: var(--accent-color);
    }

    /* News List Styling */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .news-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
      text-decoration: none;
      color: var(--text-color);
    }

    .news-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .news-date {
      font-weight: 700;
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 5px;
      display: block;
    }

    .news-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .read-btn {
      color: var(--accent-color);
      font-weight: 600;
      font-size: 14px;
    }

    /* Specific Styling for TODAY'S LIVE REPORT */
    .news-item.today-report {
      background-color: var(--today-bg);
      border: 1px solid var(--today-border);
      border-left: 5px solid var(--today-border);
    }

    .news-item.today-report .news-title {
      color: var(--today-text);
    }

    .live-badge {
      display: inline-block;
      background-color: var(--today-border);
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-right: 10px;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .controls { flex-direction: column; gap: 15px; align-items: stretch; }
      .controls-group { flex-direction: column; }
      .news-item { flex-direction: column; align-items: flex-start; gap: 10px; }
      .read-btn { align-self: flex-end; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <h1>THE GEMINI CHRONICLE AGENT</h1>
      <p>Global Intelligence Archive</p>
    </div>

    <div class="controls">
      <div style="font-weight: 600; font-size: 15px;">
        Viewing: <span id="reportCount" style="color: var(--accent-color);">100</span> Reports
      </div>
      <div class="controls-group">
        <select id="limitDropdown" class="premium-dropdown">
          <option value="100" selected>Latest 100 Reports</option>
          <option value="500">Latest 500 Reports</option>
          <option value="2000">All Reports (Slow)</option>
        </select>
        
        <select id="themeDropdown" class="premium-dropdown">
          <option value="light" selected>Light Mode</option>
          <option value="dark">Dark Mode</option>
        </select>
      </div>
    </div>

    <div id="newsContainer" class="news-list">
      </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const themeDropdown = document.getElementById("themeDropdown");
      const limitDropdown = document.getElementById("limitDropdown");
      const newsContainer = document.getElementById("newsContainer");
      const reportCountDisplay = document.getElementById("reportCount");

      // --- 1. THEME HANDLING ---
      themeDropdown.addEventListener("change", (e) => {
        document.documentElement.setAttribute("data-theme", e.target.value);
      });

      // --- 2. GENERATE MOCK DATA (Simulating 2000 JSON files from GitHub) ---
      // In production, replace this with your actual fetch() logic.
      let allReports = [];
      const todayDate = new Date(); // Script assumes this represents "Real Time"

      for (let i = 0; i < 2000; i++) {
        let tempDate = new Date(todayDate);
        tempDate.setDate(tempDate.getDate() - i);
        
        // Format YYYY-MM-DD
        const dateStr = tempDate.getFullYear() + '-' + 
                        String(tempDate.getMonth() + 1).padStart(2, '0') + '-' + 
                        String(tempDate.getDate()).padStart(2, '0');
        
        allReports.push({
          date: dateStr,
          title: `Global Daily Intelligence Briefing — ${dateStr}`,
          link: `https://github.com/ravikiranoffl/TGCA/blob/main/${tempDate.getFullYear()}/${dateStr}.md`
        });
      }

      // --- 3. CORE LOGIC: SORT, SLICE, SHUFFLE, PIN ---

      // Helper: Fisher-Yates Shuffle Algorithm
      function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      function renderNewsList(limit) {
        // A. Get exact today string to match array
        const todayStr = todayDate.getFullYear() + '-' + 
                         String(todayDate.getMonth() + 1).padStart(2, '0') + '-' + 
                         String(todayDate.getDate()).padStart(2, '0');

        // B. Find Today's Report
        const todayReport = allReports.find(report => report.date === todayStr);

        // C. Remove Today's report from the general pool
        let otherReports = allReports.filter(report => report.date !== todayStr);

        // D. Sort newest first (Descending)
        otherReports.sort((a, b) => new Date(b.date) - new Date(a.date));

        // E. Slice to get the "Hot Dated" recent pool based on dropdown limit
        const sliceCount = todayReport ? limit - 1 : limit;
        let recentPool = otherReports.slice(0, sliceCount);

        // F. Shuffle only the recent pool
        recentPool = shuffleArray(recentPool);

        // G. Combine: Pin Today at index 0, followed by the shuffled recent pool
        const finalDisplayArray = todayReport ? [todayReport, ...recentPool] : recentPool;

        // H. Render to DOM
        newsContainer.innerHTML = ""; 
        reportCountDisplay.innerText = finalDisplayArray.length;
        
        finalDisplayArray.forEach((report, index) => {
          const reportLink = document.createElement("a");
          reportLink.href = report.link;
          reportLink.target = "_blank";
          
          // Apply special styling if it's the 0-index AND it matches today's date
          if (index === 0 && todayReport) {
            reportLink.className = "news-item today-report";
            reportLink.innerHTML = `
              <div>
                <span class="news-date">LATEST INTELLIGENCE</span>
                <p class="news-title">
                  <span class="live-badge">LIVE TODAY</span>
                  ${report.title}
                </p>
              </div>
              <span class="read-btn">Access Briefing &rarr;</span>
            `;
          } else {
            // Standard Styling
            reportLink.className = "news-item";
            reportLink.innerHTML = `
              <div>
                <span class="news-date">${report.date}</span>
                <p class="news-title">${report.title}</p>
              </div>
              <span class="read-btn">Read &rarr;</span>
            `;
          }

          newsContainer.appendChild(reportLink);
        });
      }

      // --- 4. INITIALIZATION & EVENT LISTENERS ---
      
      // Initial render on load (Default to 100)
      renderNewsList(100);

      // Re-render when dropdown changes
      limitDropdown.addEventListener("change", (e) => {
        const selectedLimit = parseInt(e.target.value, 10);
        renderNewsList(selectedLimit);
      });

    });
  </script>
</body>
</html>
