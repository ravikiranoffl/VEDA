<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDA | Premium Intelligence Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Fallback variables, dynamically overwritten by JS Theme Engine */
            --bg-base: #050507;
            --bg-grad1: #0a0a12;
            --bg-grad2: #020204;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.15);
            --surface: rgba(255, 255, 255, 0.02);
            --surface-hover: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.06);
            --text-main: #ffffff;
            --text-muted: #8892b0;
            color-scheme: dark;
        }

        /* --- CORE STYLES & BACKGROUND PHYSICS --- */
        body {
            margin: 0;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 0%, var(--bg-grad1) 0%, transparent 50%),
                radial-gradient(circle at 85% 100%, var(--bg-grad2) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 1.2s ease, background-image 1.2s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 5vh 3vw;
            box-sizing: border-box;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 3.5rem;
            animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-weight: 700;
            letter-spacing: clamp(6px, 1.5vw, 16px);
            text-transform: uppercase;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            margin: 0;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: background 1.2s ease;
            text-shadow: 0 0 40px var(--accent-glow);
        }

        /* --- SEARCH BAR --- */
        .search-container {
            position: relative;
            width: clamp(280px, 60%, 800px);
            margin: 0 auto 3rem auto;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-container:focus-within {
            transform: scale(1.02);
        }

        #searchInput {
            width: 100%;
            padding: 1.4rem 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-main);
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        #searchInput::placeholder { color: var(--text-muted); transition: color 0.3s; }

        #searchInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 15px rgba(255,255,255,0.02);
            background: var(--surface-hover);
        }

        /* --- DYNAMIC FILTERS & CUSTOM DROPDOWNS --- */
        .filters-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-bottom: 5rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 100;
        }

        .date-picker {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 16px 28px;
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .date-picker:hover, .date-picker:focus {
            border-color: var(--accent);
            background: var(--surface-hover);
            box-shadow: 0 0 20px var(--accent-glow);
            outline: none;
            transform: translateY(-2px);
        }

        /* CUSTOM DROPDOWN UI */
        .custom-dropdown {
            position: relative;
            min-width: 220px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .dropdown-selected {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 16px 28px;
            border-radius: 16px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dropdown-selected:hover {
            border-color: var(--accent);
            background: var(--surface-hover);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .dropdown-selected::after {
            content: '▼';
            font-size: 0.7em;
            color: var(--accent);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .custom-dropdown.active .dropdown-selected::after {
            transform: rotate(-180deg);
        }

        .dropdown-options {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            width: 100%;
            background: rgba(10, 10, 12, 0.95);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-height: 0;
            overflow-y: auto;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 1000;
        }

        .custom-dropdown.active .dropdown-options {
            max-height: 350px;
            opacity: 1;
            pointer-events: auto;
        }

        .dropdown-option {
            padding: 16px 24px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            transform: translateX(-10px);
            opacity: 0;
        }

        .custom-dropdown.active .dropdown-option {
            transform: translateX(0);
            opacity: 1;
        }

        .dropdown-option:hover {
            color: var(--accent);
            background: var(--surface-hover);
            padding-left: 32px; 
            border-left: 3px solid var(--accent);
        }

        .dropdown-options::-webkit-scrollbar { width: 4px; }
        .dropdown-options::-webkit-scrollbar-thumb { background: var(--accent-glow); border-radius: 10px; }

        /* --- DYNAMIC TILE LAYOUT (MASONRY/DENSE) --- */
        #news-grid {
            display: grid;
            gap: 2rem;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            grid-auto-flow: dense; /* Allows tiles to pack tightly */
        }

        .card {
            background: linear-gradient(145deg, var(--surface) 0%, rgba(0,0,0,0.3) 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* Subtle internal gradient that activates on hover */
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.6s ease; pointer-events: none; z-index: 0;
        }

        /* THE HERO TILE (Absolute Newest Element) */
        .card.pinned-latest {
            grid-column: span 2; /* Spans two columns on desktop */
            grid-row: span 2;    /* Makes it significantly taller */
            background: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, var(--bg-base) 100%);
            border: 1px solid var(--accent);
            box-shadow: inset 0 0 40px var(--accent-glow), 0 20px 50px rgba(0,0,0,0.4);
            justify-content: center;
        }

        .card.pinned-latest .card-title {
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 300;
            line-height: 1.3;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 25px var(--accent-glow);
            z-index: 10;
        }

        .card:hover::before { opacity: 1; }

        .card-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 1.5rem; z-index: 1; position: relative;
        }

        .card-tag {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            display: inline-block;
        }

        /* Pulsing animation specifically for the "Breaking" tag */
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 var(--accent-glow); }
            70% { box-shadow: 0 0 0 10px rgba(0,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }
        .pulse-tag {
            animation: subtlePulse 2s infinite;
            border-color: var(--accent);
            color: #fff;
            background: var(--accent-glow);
        }

        .timestamp {
            font-size: 0.8rem; color: var(--text-muted); font-weight: 500;
        }

        .card-title {
            font-size: clamp(1.15rem, 2vw, 1.4rem);
            line-height: 1.5;
            margin-bottom: 2.5rem;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: -0.3px;
            z-index: 1; position: relative;
            flex-grow: 1;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 1; position: relative;
        }

        /* Ghost Button Design */
        .read-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 24px;
            border-radius: 12px;
            background: transparent;
            border: 1px solid var(--accent);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            font-family: inherit;
        }

        .read-btn:hover {
            color: var(--bg-base);
            background: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateX(5px);
        }

        /* --- DEEP ARCHIVE MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--bg-base); border: 1px solid var(--accent);
            width: 90%; max-width: 900px; max-height: 85vh; border-radius: 24px;
            padding: 40px; overflow-y: auto; position: relative;
            box-shadow: 0 0 60px rgba(0,0,0,0.6), inset 0 0 30px var(--accent-glow);
            transform: translateY(30px) scale(0.95); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

        .close-modal {
            position: absolute; top: 25px; right: 25px;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text-muted); width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .close-modal:hover { color: var(--bg-base); background: var(--accent); border-color: var(--accent); transform: rotate(90deg); }

        .modal-text {
            color: var(--text-main); line-height: 1.9; font-size: 1.15rem;
            white-space: pre-wrap; font-weight: 300; letter-spacing: 0.3px;
        }

        /* --- RESPONSIVE SHAPE-SHIFTING --- */
        @media (max-width: 1024px) { 
            .card.pinned-latest { grid-column: span 1; grid-row: span 1; } /* Reset spanning on smaller screens */
            .filters-wrapper { gap: 15px; } 
        }
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; letter-spacing: 6px; }
            .card { padding: 1.8rem; }
            .card-title { font-size: 1.2rem; margin-bottom: 1.5rem; }
            .modal-content { padding: 30px 20px; }
        }
        @media (max-width: 500px) {
            .filters-wrapper { flex-direction: column; width: 100%; align-items: stretch; }
            .date-picker, .custom-dropdown { width: 100%; box-sizing: border-box; }
            #searchInput { border-radius: 16px; padding: 1.2rem 1.5rem; } 
            .card { border-radius: 16px; }
            .card-header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .read-btn { width: 100%; text-align: center; justify-content: center; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VEDA Matrix</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Initializing neural link...">
    </div>

    <div class="filters-wrapper">
        <input type="date" id="datePicker" class="date-picker" min="2026-04-27">

        <div class="custom-dropdown channel" id="channelDropdown">
            <div class="dropdown-selected" id="channelSelected">Global Matrix (All)</div>
            <div class="dropdown-options" id="channelOptions">
                <div class="dropdown-option" data-value="all">Global Matrix (All)</div>
            </div>
        </div>

        <div class="custom-dropdown" id="limitDropdown">
            <div class="dropdown-selected" id="limitSelected">Show 100 Intel</div>
            <div class="dropdown-options" id="limitOptions">
                <div class="dropdown-option" data-value="100">Show 100 Intel</div>
                <div class="dropdown-option" data-value="250">Show 250 Intel</div>
            </div>
        </div>

        <div class="custom-dropdown" id="themeDropdown">
            <div class="dropdown-selected" id="themeSelected">Select Theme</div>
            <div class="dropdown-options" id="themeOptions"></div>
        </div>
    </div>

    <div id="news-grid"></div>
</div>

<div class="modal-overlay" id="deepModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">×</button>
        <h2 id="modalTitle" style="color: var(--accent); margin-top:0; padding-right: 40px; line-height: 1.4;">Accessing Deep Archive...</h2>
        <div id="modalBody" class="modal-text">
            <p style="opacity:0.5; text-align:center;">Establishing uplink to HEDA Vault...</p>
        </div>
    </div>
</div>

<script>
    // --- 1. OVERHAULED PREMIUM THEME ENGINE ---
    // Replaced standard colors with 5 highly curated, distinct, premium palettes.
    const themes = {
        "Cyber Void": { base: "#050507", grad1: "#0a0a12", grad2: "#020204", accent: "#00ffcc", glow: "rgba(0, 255, 204, 0.15)" },
        "Crimson Protocol": { base: "#080202", grad1: "#140404", grad2: "#050101", accent: "#ff3366", glow: "rgba(255, 51, 102, 0.15)" },
        "Imperial Gold": { base: "#0a0a0a", grad1: "#141414", grad2: "#000000", accent: "#ffd700", glow: "rgba(255, 215, 0, 0.15)" },
        "Quantum Cobalt": { base: "#02040a", grad1: "#050a1a", grad2: "#010205", accent: "#4488ff", glow: "rgba(68, 136, 255, 0.15)" },
        "Toxic Executive": { base: "#030805", grad1: "#06140a", grad2: "#010302", accent: "#00ff66", glow: "rgba(0, 255, 102, 0.15)" }
    };

    const themeNames = Object.keys(themes);

    function applyTheme(themeName) {
        const theme = themes[themeName];
        if(!theme) return;
        document.documentElement.style.setProperty('--bg-base', theme.base);
        document.documentElement.style.setProperty('--bg-grad1', theme.grad1);
        document.documentElement.style.setProperty('--bg-grad2', theme.grad2);
        document.documentElement.style.setProperty('--accent', theme.accent);
        document.documentElement.style.setProperty('--accent-glow', theme.glow);
        document.getElementById('themeSelected').innerText = themeName;
    }

    // Auto-select a random premium theme on load
    applyTheme(themeNames[Math.floor(Math.random() * themeNames.length)]);

    // --- 2. CUSTOM DROPDOWN LOGIC ---
    function setupDropdown(dropdownId, selectedId, optionsId, onChangeCallback) {
        const dropdown = document.getElementById(dropdownId);
        const selected = document.getElementById(selectedId);
        const optionsContainer = document.getElementById(optionsId);

        selected.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.custom-dropdown').forEach(d => {
                if(d !== dropdown) d.classList.remove('active');
            });
            dropdown.classList.toggle('active');
        });

        optionsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('dropdown-option')) {
                const value = e.target.getAttribute('data-value');
                selected.innerText = e.target.innerText;
                dropdown.classList.remove('active');
                if (onChangeCallback) onChangeCallback(value);
            }
        });
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.custom-dropdown').forEach(d => d.classList.remove('active'));
    });

    const themeOptionsContainer = document.getElementById('themeOptions');
    themeNames.forEach(themeName => {
        const opt = document.createElement('div');
        opt.className = 'dropdown-option';
        opt.setAttribute('data-value', themeName);
        opt.innerText = themeName;
        themeOptionsContainer.appendChild(opt);
    });

    setupDropdown('themeDropdown', 'themeSelected', 'themeOptions', (val) => applyTheme(val));

    let currentChannelFilter = 'all';
    setupDropdown('channelDropdown', 'channelSelected', 'channelOptions', (val) => {
        currentChannelFilter = val;
        filterAndRender();
    });

    let currentLimitFilter = 100;
    setupDropdown('limitDropdown', 'limitSelected', 'limitOptions', (val) => {
        currentLimitFilter = parseInt(val, 10);
        filterAndRender();
    });

    // --- 3. DYNAMIC TYPING ENGINE ---
    const searchInput = document.getElementById('searchInput');
    const suggestions = ['Analyze "The Hindu"...', 'Extract "Global Economy"...', 'Scan for "Markets"...', 'Intercept "Telugu News"...', 'Decode "Technology"...'];
    suggestions.sort(() => Math.random() - 0.5);

    let suggestionIndex = 0, charIndex = 0, isDeleting = false, typingTimer;

    function typePlaceholder() {
        if (document.activeElement === searchInput) { searchInput.placeholder = "Query global matrix..."; clearTimeout(typingTimer); return; }
        const currentWord = suggestions[suggestionIndex];
        isDeleting ? charIndex-- : charIndex++;
        searchInput.placeholder = currentWord.substring(0, charIndex) + "|";
        let typingSpeed = isDeleting ? 30 : 80;

        if (!isDeleting && charIndex === currentWord.length) { typingSpeed = 2500; isDeleting = true; } 
        else if (isDeleting && charIndex === 0) { isDeleting = false; suggestionIndex = (suggestionIndex + 1) % suggestions.length; typingSpeed = 500; }
        typingTimer = setTimeout(typePlaceholder, typingSpeed);
    }
    typePlaceholder();

    searchInput.addEventListener('focus', () => { clearTimeout(typingTimer); searchInput.placeholder = "Query global matrix..."; });
    searchInput.addEventListener('blur', () => { if (searchInput.value.trim() === '') typePlaceholder(); });
    searchInput.addEventListener('input', () => filterAndRender());

    // --- 4. DATA ENGINE & STRICT CHRONOLOGICAL SORTING ---
    let rawData = [];
    const grid = document.getElementById('news-grid');
    const datePicker = document.getElementById('datePicker');

    // INITIALIZE DATE PICKER (Dynamic Today)
    const today = new Date();
    const istOffset = 5.5 * 60 * 60 * 1000;
    const istTime = new Date(today.getTime() + istOffset);
    const todayStr = istTime.toISOString().split('T')[0];
    
    datePicker.value = todayStr;
    datePicker.max = todayStr; // Block Future
    datePicker.addEventListener('change', (e) => init(e.target.value));

    async function init(date) {
        grid.innerHTML = '<p style="text-align:center; opacity:0.5; width:100%; grid-column: 1/-1;">Establishing Secure Connection to VEDA Archive...</p>';
        const year = date.split('-')[0];

        try {
            const res = await fetch(`${year}/${date}.json`);
            if (!res.ok) throw new Error("Intelligence not found for this temporal coordinate.");
            const data = await res.json();

            rawData = [];
            Object.keys(data.feeds).forEach(source => {
                data.feeds[source].forEach(item => {
                    rawData.push({ ...item, source });
                });
            });

            populateChannels(Object.keys(data.feeds));
            filterAndRender();
        } catch (e) {
            grid.innerHTML = `<p style="text-align:center; color:var(--accent); width:100%; grid-column: 1/-1;">${e.message}</p>`;
        }
    }

    function populateChannels(sources) {
        const container = document.getElementById('channelOptions');
        container.innerHTML = '<div class="dropdown-option" data-value="all">Global Matrix (All)</div>';
        sources.sort().forEach(s => {
            const opt = document.createElement('div');
            opt.className = 'dropdown-option';
            opt.setAttribute('data-value', s);
            opt.innerText = s.replace(/_/g, ' ');
            container.appendChild(opt);
        });
        document.getElementById('channelSelected').innerText = 'Global Matrix (All)';
        currentChannelFilter = 'all';
    }

    function filterAndRender() {
        const query = searchInput.value.toLowerCase();
        let filtered = rawData.filter(item => {
            const matchChannel = currentChannelFilter === 'all' || item.source === currentChannelFilter;
            const matchQuery = item.title.toLowerCase().includes(query) || item.source.toLowerCase().includes(query);
            return matchChannel && matchQuery;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="text-align:center; opacity:0.5; width:100%; grid-column: 1/-1;">No intelligence matches your parameters.</p>';
            return;
        }

        // UNTOUCHED: Strict Chronological Sort
        filtered.sort((a, b) => {
            const dateA = new Date(a.published_at).getTime() || 0;
            const dateB = new Date(b.published_at).getTime() || 0;
            return dateB - dateA;
        });

        // Slice to User Limit
        filtered = filtered.slice(0, currentLimitFilter);

        // RENDER DOM
        grid.innerHTML = '';
        filtered.forEach((item, index) => {
            const card = document.createElement('div');
            // The newest item gets the massive Hero layout via 'pinned-latest'
            card.className = `card ${index === 0 ? 'pinned-latest' : ''}`;
            
            const formatSource = item.source.replace(/_/g, ' ');
            const dateStr = item.published_at !== "N/A" ? new Date(item.published_at).toLocaleString() : 'Recent';
            const safeTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            // The inner HTML matches the new layout variables
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-tag ${index === 0 ? 'pulse-tag' : ''}">${index === 0 ? '🔥 BREAKING REAL-TIME' : formatSource}</span>
                    <span class="timestamp">${dateStr}</span>
                </div>
                <h3 class="card-title">${item.title}</h3>
                <div class="card-footer">
                    <button onclick="openDeepArchive('${item.id}', '${safeTitle}', '${item.url}', '${datePicker.value}')" class="read-btn">Deep Scan &rarr;</button>
                </div>
            `;
            grid.appendChild(card);
            
            // Staggered pop-in animation
            setTimeout(() => card.classList.add('visible'), 40 * index);
        });
    }

    // --- 5. HEDA UPLINK & MODAL LOGIC ---
    let cachedDeepArchive = null;
    let cachedArchiveDate = null;

    async function openDeepArchive(articleId, title, originalUrl, dateStr) {
        const modal = document.getElementById('deepModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.innerText = title;
        modalBody.innerHTML = '<p style="opacity:0.5; text-align:center;">Establishing uplink to HEDA Vault...</p>';
        modal.classList.add('active');

        // Fetch the 30MB file from Hugging Face only once per session
        if (cachedArchiveDate !== dateStr || !cachedDeepArchive) {
            try {
                // Connects directly to ravikiranoffl/HEDA
                const hfUrl = `https://huggingface.co/datasets/ravikiranoffl/HEDA/resolve/main/data/${dateStr}.json`;
                const res = await fetch(hfUrl);
                if (!res.ok) throw new Error("Archive missing");
                cachedDeepArchive = await res.json();
                cachedArchiveDate = dateStr;
            } catch (e) {
                modalBody.innerHTML = `
                    <p style="color:#ff4d4d; text-align:center; padding: 20px;">Deep Archive unavailable for this coordinate.</p>
                    <div style="text-align:center; margin-top:10px;">
                        <a href="${originalUrl}" target="_blank" class="read-btn" style="display:inline-flex;">Open Source Node &rarr;</a>
                    </div>
                `;
                return;
            }
        }

        // Display the specific article
        const deepText = cachedDeepArchive[articleId];
        if (deepText) {
            modalBody.innerText = deepText;
            modalBody.innerHTML += `
                <div style="text-align:center; margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--border);">
                    <a href="${originalUrl}" target="_blank" class="read-btn" style="display:inline-flex;">Access Original Source Window</a>
                </div>
            `;
        } else {
            modalBody.innerHTML = `
                <p style="color:#ff4d4d; text-align:center; padding: 20px;">Extraction failed during sweep. Node may be encrypted.</p>
                <div style="text-align:center; margin-top:10px;">
                    <a href="${originalUrl}" target="_blank" class="read-btn" style="display:inline-flex;">Open Source Node &rarr;</a>
                </div>
            `;
        }
    }

    function closeModal() {
        document.getElementById('deepModal').classList.remove('active');
    }

    // Close modal when clicking the dark overlay outside the box
    document.getElementById('deepModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // Trigger Initial Load
    init(datePicker.value);

</script>
</body>
