<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDA | Premium Intelligence Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Fallback Theme (Cyber Cyan) */
            --bg-base: #020508;
            --bg-grad1: #06111a;
            --bg-grad2: #010204;
            --accent: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.4);
            --surface: rgba(10, 15, 25, 0.5);
            --surface-hover: rgba(20, 30, 45, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.15);
            --text-main: #f8f9fa;
            --text-muted: #8b9bb4;
            --stat-excellent: #00ffaa;
            --stat-warn: #ffcc00;
            --stat-dead: #ff3366;
            color-scheme: dark;
        }

        /* --- GLOBAL PHYSICS & TYPOGRAPHY --- */
        *, *::before, *::after { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        body {
            margin: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- PREMIUM ANIMATED BACKGROUND MATRIX --- */
        .ambient-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, var(--bg-grad1) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, var(--bg-grad2) 0%, transparent 50%);
            transition: all 1s ease;
        }
        .ambient-background::after {
            content: ''; position: absolute; top: 0; left: 0; width: 200vw; height: 200vh;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: panGrid 60s linear infinite;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            opacity: 0.3;
        }
        @keyframes panGrid { 0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); } 100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); } }

        /* --- UI LAYOUT --- */
        .container {
            width: 100%; max-width: 1600px; margin: 0 auto;
            padding: 120px clamp(1.5rem, 4vw, 4rem) 4rem;
            transition: filter 0.4s ease;
        }

        /* --- GLASS NAVIGATION --- */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem clamp(1.5rem, 4vw, 4rem);
            background: rgba(2, 5, 8, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .brand-logo {
            font-weight: 700; letter-spacing: 8px; font-size: 1.8rem; margin: 0;
            background: linear-gradient(135deg, #fff 20%, var(--accent) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--accent-glow);
        }
        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 6px; z-index: 2001; }
        .hamburger span {
            display: block; width: 32px; height: 2px; background: var(--accent);
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; transform: translateX(20px); }
        .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* --- SIDEBAR --- */
        .sidebar {
            position: fixed; top: 0; right: -400px; width: min(100vw, 400px); height: 100vh;
            background: rgba(5, 7, 12, 0.85);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--border-highlight);
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
            z-index: 1999; display: flex; flex-direction: column; padding: 120px 2rem 2rem;
            transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sidebar.active { right: 0; }
        .menu-item {
            color: var(--text-main); text-decoration: none; font-size: 1.1rem; font-weight: 600; 
            padding: 1.2rem 1rem; border-bottom: 1px solid var(--border);
            transition: all 0.3s ease; letter-spacing: 2px; text-transform: uppercase;
            position: relative; overflow: hidden;
        }
        .menu-item:hover { color: var(--accent); padding-left: 2rem; border-bottom-color: var(--accent); background: rgba(255,255,255,0.02); }

        /* --- VIEWS & HEADERS --- */
        .view-section { display: none; animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .view-section.active { display: block; }
        @keyframes popIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .page-header { text-align: center; margin-bottom: 4rem; }
        .page-header h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 700; letter-spacing: 4px; margin: 0;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-badge {
            display: inline-flex; align-items: center; gap: 10px; margin-top: 1.5rem;
            padding: 8px 20px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 50px; font-size: 0.85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.5); } }

        /* --- ADVANCED DATA GRID --- */
        .grid-container {
            display: grid; gap: 2rem;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
        }
        .card {
            background: linear-gradient(145deg, var(--surface) 0%, rgba(0,0,0,0.8) 100%);
            border: 1px solid var(--border); border-radius: 24px; padding: 2rem;
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), var(--accent-glow), transparent 40%);
            opacity: 0; transition: opacity 0.4s; pointer-events: none; z-index: 0;
        }
        .card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow); }
        .card:hover::before { opacity: 1; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; z-index: 1; position: relative; }
        .card-tag { font-size: 0.75rem; color: var(--accent); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 6px 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-highlight); border-radius: 8px; }
        .card-time { font-size: 0.8rem; color: var(--text-muted); }
        .card-title { font-size: 1.25rem; line-height: 1.5; font-weight: 500; color: var(--text-main); flex-grow: 1; z-index: 1; position: relative; margin-bottom: 2rem; }
        
        .btn-premium {
            align-self: flex-start; padding: 12px 24px; border-radius: 12px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border-highlight);
            color: var(--text-main); font-size: 0.8rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all 0.3s ease; z-index: 1; position: relative; overflow: hidden;
        }
        .btn-premium:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent-glow); border-color: var(--accent); }

        /* --- THEME CALIBRATION GRID --- */
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; max-width: 1000px; margin: 0 auto; }
        .theme-btn {
            padding: 1.5rem 1rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; text-align: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .theme-btn:hover { transform: scale(1.05) translateY(-5px); }

    </style>
</head>
<body>

<div class="ambient-background" id="ambientBg"></div>

<nav class="top-nav">
    <h1 class="brand-logo">VEDA</h1>
    <div class="hamburger" id="hamburgerBtn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
</nav>

<div class="sidebar" id="sidebarMenu">
    <a href="#" class="menu-item" onclick="switchView('view-home')">Neural Grid</a>
    <a href="#" class="menu-item" onclick="switchView('view-settings')">Matrix Calibration</a>
    <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px;">
        SYSTEM SECURE<br>HEDA VAULT V3.0
    </div>
</div>

<div class="container" id="mainContainer">
    
    <!-- MAIN GRID VIEW -->
    <div id="view-home" class="view-section active">
        <div class="page-header">
            <h1>NEURAL MATRIX</h1>
            <div class="status-badge">
                <span class="status-dot"></span>
                LIVE UPLINK ESTABLISHED
            </div>
        </div>

        <div class="grid-container" id="news-grid">
            <!-- Cards will be injected here via JavaScript -->
        </div>
    </div>

    <!-- CALIBRATION VIEW -->
    <div id="view-settings" class="view-section">
        <div class="page-header">
            <h1>CALIBRATION</h1>
            <p style="color: var(--text-muted); letter-spacing: 2px;">SELECT NEURAL CORE INTERFACE</p>
        </div>
        <div class="theme-grid" id="themeButtonsContainer"></div>
    </div>

</div>

<script>
    // --- 1. PREMIUM THEME ENGINE (21 COLORS) ---
    const themes = {
        "Cyber Cyan": { base: "#020508", grad1: "#06111a", grad2: "#010204", accent: "#00f3ff", glow: "rgba(0, 243, 255, 0.4)", text: "#e6fdff" },
        "Cobalt Protocol": { base: "#010205", grad1: "#04081c", grad2: "#01010a", accent: "#2d5bff", glow: "rgba(45, 91, 255, 0.4)", text: "#e6ecff" },
        "Ice Node": { base: "#020608", grad1: "#071822", grad2: "#010305", accent: "#00b3ff", glow: "rgba(0, 179, 255, 0.4)", text: "#e6f7ff" },
        "Acid Rain": { base: "#030602", grad1: "#0a1708", grad2: "#010301", accent: "#39ff14", glow: "rgba(57, 255, 20, 0.4)", text: "#efffe6" },
        "Matrix Mint": { base: "#020805", grad1: "#051a11", grad2: "#010503", accent: "#00ffa3", glow: "rgba(0, 255, 163, 0.4)", text: "#e6fff4" },
        "Bio-Hazard": { base: "#050601", grad1: "#141a02", grad2: "#030400", accent: "#bfff00", glow: "rgba(191, 255, 0, 0.4)", text: "#f6ffe6" },
        "Blood Moon": { base: "#080202", grad1: "#1a0404", grad2: "#040101", accent: "#ff2a2a", glow: "rgba(255, 42, 42, 0.4)", text: "#ffe6e6" },
        "Solar Flare": { base: "#080301", grad1: "#1f0902", grad2: "#050100", accent: "#ff5e00", glow: "rgba(255, 94, 0, 0.4)", text: "#ffece6" },
        "Crimson Forge": { base: "#050102", grad1: "#170205", grad2: "#040001", accent: "#ff004c", glow: "rgba(255, 0, 76, 0.4)", text: "#ffe6ee" },
        "Deep Amethyst": { base: "#040108", grad1: "#1b0a3a", grad2: "#080310", accent: "#aa44ff", glow: "rgba(170, 68, 255, 0.4)", text: "#f0e6ff" },
        "Neon Synth": { base: "#070106", grad1: "#1f031b", grad2: "#0a0008", accent: "#ff00d4", glow: "rgba(255, 0, 212, 0.4)", text: "#ffe6fa" },
        "Ultraviolet": { base: "#020108", grad1: "#0a0422", grad2: "#010005", accent: "#7000ff", glow: "rgba(112, 0, 255, 0.4)", text: "#ebe6ff" },
        "Reactor Yellow": { base: "#080701", grad1: "#1a1602", grad2: "#040300", accent: "#ffea00", glow: "rgba(255, 234, 0, 0.4)", text: "#fffce6" },
        "Imperial Gold": { base: "#080501", grad1: "#1f1202", grad2: "#050300", accent: "#ffb700", glow: "rgba(255, 183, 0, 0.4)", text: "#fff6e6" },
        "Amber Alert": { base: "#080400", grad1: "#1a0d00", grad2: "#050200", accent: "#ff9100", glow: "rgba(255, 145, 0, 0.4)", text: "#fff2e6" },
        "Ghost Silver": { base: "#030303", grad1: "#111111", grad2: "#010101", accent: "#cfcfcf", glow: "rgba(207, 207, 207, 0.4)", text: "#ffffff" },
        "Carbon Fiber": { base: "#000000", grad1: "#0a0a0a", grad2: "#000000", accent: "#8c8c8c", glow: "rgba(140, 140, 140, 0.4)", text: "#e0e0e0" },
        "Tungsten Blue": { base: "#010203", grad1: "#040a12", grad2: "#000101", accent: "#6f91b5", glow: "rgba(111, 145, 181, 0.4)", text: "#e8eff5" },
        "Toxic Peach": { base: "#080403", grad1: "#1a0b07", grad2: "#050101", accent: "#ff7b59", glow: "rgba(255, 123, 89, 0.4)", text: "#ffece6" },
        "Deep Ocean": { base: "#010306", grad1: "#030d1c", grad2: "#000103", accent: "#0066ff", glow: "rgba(0, 102, 255, 0.4)", text: "#e6f0ff" },
        "Vaporwave": { base: "#040206", grad1: "#130822", grad2: "#020104", accent: "#00e5ff", glow: "rgba(255, 0, 255, 0.4)", text: "#f2e6ff" }
    };

    function applyTheme(name) {
        const t = themes[name];
        document.documentElement.style.setProperty('--bg-base', t.base);
        document.documentElement.style.setProperty('--bg-grad1', t.grad1);
        document.documentElement.style.setProperty('--bg-grad2', t.grad2);
        document.documentElement.style.setProperty('--accent', t.accent);
        document.documentElement.style.setProperty('--accent-glow', t.glow);
        localStorage.setItem("veda-theme", name);
    }

    // Initialize Theme
    (function(){
        const saved = localStorage.getItem("veda-theme");
        if(saved && themes[saved]) applyTheme(saved);
        else applyTheme("Cyber Cyan");
    })();

    // Build Theme Buttons
    const themeContainer = document.getElementById('themeButtonsContainer');
    Object.keys(themes).forEach(n => {
        const b = document.createElement('button');
        b.className = 'theme-btn';
        b.innerText = n;
        b.style.background = `linear-gradient(135deg, ${themes[n].grad1}, ${themes[n].base})`;
        b.style.borderColor = themes[n].accent;
        b.style.boxShadow = `0 0 20px ${themes[n].glow}`;
        b.style.color = themes[n].text;
        b.onclick = () => applyTheme(n);
        themeContainer.appendChild(b);
    });

    // --- 2. UI ROUTING & NAVIGATION ---
    function toggleMenu() {
        document.getElementById('sidebarMenu').classList.toggle('active');
        document.getElementById('hamburgerBtn').classList.toggle('active');
        const container = document.getElementById('mainContainer');
        container.style.filter = document.getElementById('sidebarMenu').classList.contains('active') ? 'blur(8px) brightness(0.6)' : 'none';
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if(document.getElementById('sidebarMenu').classList.contains('active')) toggleMenu();
        window.scrollTo(0,0);
    }

    // --- 3. DYNAMIC DATA ENGINE (MOCK INITIALIZATION) ---
    // This connects to your Python backend JSON outputs.
    const grid = document.getElementById('news-grid');

    function createCard(item, index) {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${index * 0.1}s`; // Staggered entrance
        
        // CSS Light tracking effect
        card.addEventListener("mousemove", e => {
            const rect = card.getBoundingClientRect();
            card.style.setProperty("--mouse-x", `${e.clientX - rect.left}px`);
            card.style.setProperty("--mouse-y", `${e.clientY - rect.top}px`);
        });

        card.innerHTML = `
            <div class="card-header">
                <span class="card-tag">${item.source}</span>
                <span class="card-time">LIVE</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <button class="btn-premium" onclick="window.open('${item.url}', '_blank')">Access Intel &rarr;</button>
        `;
        return card;
    }

    async function loadData() {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">Decrypting stream...</p>';
        
        try {
            // Replace this with your actual fetch logic: fetch(`${date}.json`)
            // Providing dummy data to ensure the UI renders beautifully upon load.
            const mockData = [
                { source: "CISA CYBER", title: "Defending Against China-Nexus Covert Networks of Compromised Devices", url: "#" },
                { source: "GDACS SHOCK", title: "Magnitude 5.7M Earthquake detected in Papua New Guinea", url: "#" },
                { source: "SACHET INDIA", title: "National Disaster Alert System: Heavy Rainfall Warning", url: "#" },
                { source: "LIVELAW NYAY", title: "Supreme Court Issues Notice On Digital Privacy Bill", url: "#" },
                { source: "PIB INFRA", title: "Cabinet Approves Massive Semiconductor Fabrication Plant", url: "#" },
                { source: "UKMTO NAVAL", title: "Maritime Security Alert: Uncrewed Aerial System Detonation", url: "#" }
            ];
            
            grid.innerHTML = '';
            mockData.forEach((item, index) => {
                grid.appendChild(createCard(item, index));
            });

        } catch (e) {
            grid.innerHTML = `<p style="text-align:center; color: var(--stat-dead); grid-column: 1/-1;">Matrix Offline: ${e.message}</p>`;
        }
    }

    // Initialize System
    loadData();

</script>
</body>
</html>
