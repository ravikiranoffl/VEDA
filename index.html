<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDA | Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #4ecca3;
            --text: #ffffff;
        }

        body {
            margin: 0;
            background: #0a0b10;
            background-image: radial-gradient(circle at 50% -20%, #1c2a4d, #0a0b10);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Control Panel */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            background: var(--glass);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(15px);
            margin-bottom: 40px;
        }

        select, input[type="date"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        select:hover, input:hover {
            border-color: var(--accent);
        }

        /* News Grid */
        #news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
            animation: fadeIn 0.5s ease forwards;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
        }

        .card-tag {
            font-size: 0.65rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .btn-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-link:hover {
            text-decoration: underline;
            color: #fff;
        }

        .timestamp {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VEDA Intelligence</h1>
    </header>

    <div class="controls">
        <div>
            <span>Date: </span>
            <input type="date" id="datePicker">
        </div>
        <div>
            <span>Channel: </span>
            <select id="channelFilter">
                <option value="all">All Channels</option>
                </select>
        </div>
    </div>

    <div id="news-grid">
        </div>
</div>

<script>
    let globalData = null;
    const grid = document.getElementById('news-grid');
    const channelFilter = document.getElementById('channelFilter');
    const datePicker = document.getElementById('datePicker');

    // Auto-set today
    const today = new Date().toISOString().split('T')[0];
    datePicker.value = today;

    async function loadData(date) {
        const year = date.split('-')[0];
        const path = `${year}/${date}.json`;
        
        try {
            const response = await fetch(path);
            if (!response.ok) throw new Error("No intelligence found for this date.");
            globalData = await response.json();
            
            updateFilters(globalData.feeds);
            renderNews('all');
        } catch (err) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">${err.message}</p>`;
        }
    }

    function updateFilters(feeds) {
        const currentVal = channelFilter.value;
        channelFilter.innerHTML = '<option value="all">All Channels</option>';
        Object.keys(feeds).sort().forEach(feed => {
            const opt = document.createElement('option');
            opt.value = feed;
            opt.innerText = feed.replace(/_/g, ' ');
            channelFilter.appendChild(opt);
        });
        channelFilter.value = currentVal;
    }

    function renderNews(filter) {
        grid.innerHTML = '';
        if (!globalData) return;

        const feedsToRender = filter === 'all' 
            ? Object.keys(globalData.feeds) 
            : [filter];

        feedsToRender.forEach(feedName => {
            if (!globalData.feeds[feedName]) return;
            
            globalData.feeds[feedName].forEach(article => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-tag">${feedName.replace(/_/g, ' ')}</div>
                        <div class="card-title">${article.title}</div>
                    </div>
                    <div class="card-footer">
                        <span class="timestamp">${article.published_at.split(' ').slice(0,4).join(' ')}</span>
                        <a href="${article.url}" target="_blank" class="btn-link">Read Full Article →</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    }

    datePicker.addEventListener('change', (e) => loadData(e.target.value));
    channelFilter.addEventListener('change', (e) => renderNews(e.target.value));

    // Initial Load
    loadData(today);
</script>

</body>
</html>
